<script>
// ===== Dữ liệu thật quầy POS Chiềng Sại (site pos.next, 02/10/2026); hạn mức & điều khoản là giả định =====
const TODAY = '2026-10-02';
const ITEMS = [
  ['146047','Chả cá thát lát ốc vị sả ớt 200g',43240.74],['146048','Chả Tôm 200G',59351.85],
  ['146049','Chả viên thát lát 200g',40833.33],['1000002260','Cốc nhựa sọc 330ml',2682],
  ['146100','COLGATE BCĐ than hoạt tính',78703.70],['146101','COLGATE KĐR bạc hà',52777.78],
  ['146050','Hapi cá thát lát 500g',55648.15],['146102','KDR COL TOT trắng',53703.70]];
const MANAGERS = [{name:'Quân Đặng',role:'Store Manager',email:'quandm@mbw.vn'},{name:'Hằng Nguyễn',role:'Store Manager',email:'hangnt@mbw.vn'}];
function freshCustomers(){ return withG([
  {id:'walkin',name:'Khách lẻ',phone:'',group:'Individual',walkin:true,terms:0,limit:0,inv:[]},
  {id:'840975961375-1',name:'0975961375',phone:'+84-0975961375',group:'Individual',terms:0,limit:300000,
    inv:[{n:'ACC-SINV-2026-00101',d:'2026-07-25',o:154900},{n:'ACC-SINV-2026-00102',d:'2026-07-25',o:86200}]},
  {id:'KH010504',name:'A Linh',phone:'0906003728',group:'Khách quen',terms:180,limit:500000,
    inv:[{n:'ACC-SINV-2026-00045',d:'2026-05-19',o:59900},{n:'ACC-SINV-2026-00048',d:'2026-05-19',o:2809}]},
  {id:'84940297480',name:'Chị Huế',phone:'+84-940297480',group:'Khách buôn',terms:0,limit:0,
    inv:[{n:'ACC-SINV-2026-00046',d:'2026-05-19',o:17700}]},
  {id:'1',name:'THU HUONG',phone:'',group:'Individual',terms:0,limit:0,inv:[{n:'ACC-SINV-2026-00050',d:'2026-05-19',o:7864},{n:'ACC-SINV-2026-00060',d:'2026-05-22',o:25},{n:'ACC-SINV-2026-00092',d:'2026-07-23',o:19.99},{n:'ACC-SINV-2026-00044',d:'2026-05-19',o:15.04}]},
  {id:'KH-HANG',name:'Hằng',phone:'+84-975961375',group:'Individual',terms:0,limit:0,inv:[]},
]);}
function withG(list){ list.forEach(c=>c.inv.forEach(i=>i.g=i.o)); return list; }
const DEF_CFG = {enabled:true, threshold:0, excluded:['Khách buôn'], allowCredit:true, hideBelow:1000, collectOn:true, canCollect:true, offline:false,
  optA:'A1', defDays:15};

let S; // trạng thái
function reset(){ S={cfg:{...DEF_CFG, excluded:[...DEF_CFG.excluded]}, custs:freshCustomers(), cust:null, cart:[], q:'', drop:false,
  dlg:null, toast:null, drawer:false, seq:103, collected:null, payPaid:0, payMop:'Cash', approveErr:'', lastCredit:null}; }
reset();

// ===== tiện ích =====
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vnd=n=>Math.round(n).toLocaleString('vi-VN')+' ₫';
const vnd2=n=>'₫ '+n.toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2});
const d=s=>new Date(s+'T00:00:00Z');
const addDays=(s,n)=>{const x=d(s);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);};
const dm=s=>s.slice(8,10)+'/'+s.slice(5,7);
const diff=(a,b)=>Math.round((d(b)-d(a))/86400000);
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

// Hạn TT = ngày bán + số ngày được nợ của quầy (chốt A2), tính khi đọc nên áp cả đơn cũ
function dueOf(c,i){ return addDays(i.d, S.cfg.defDays||0); }
function debts(c){ return c.inv.filter(i=>i.o>=1 && i.o>=S.cfg.hideBelow).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.n<b.n?-1:1)
  .map(i=>{const due=dueOf(c,i); const late=diff(due,TODAY); return {...i,due,days:diff(i.d,TODAY),late,od:late>0&&i.o>=i.g-1};}); }
function total(c){ return debts(c).reduce((s,i)=>s+i.o,0); }
// Quá hạn = chưa trả đồng nào và đã qua hạn thanh toán (thống nhất với chức năng 1)
function overdue(c){ return debts(c).filter(i=>i.od); }
function excluded(c){ return S.cfg.excluded.includes(c.group); }
function warnable(c){ return c && S.cfg.enabled && !c.walkin && total(c)>0 && total(c)>=S.cfg.threshold && !excluded(c); }
function cartSub(){ return S.cart.reduce((s,l)=>s+l.p*l.q,0); }
function cartTotal(){ return Math.round(cartSub()*1.08*100)/100; } // thuế 8% như POS Chiềng Sại
function badgeKind(c){ if(S.cfg.offline) return 'g'; return (overdue(c).length || (c.limit>0&&total(c)>c.limit))?'r':'y'; }
function toast(t,s){ S.toast={t,s}; render(); clearTimeout(window.__tt); window.__tt=setTimeout(()=>{S.toast=null;render();},3200); }

// ===== hành động =====
const canColl=()=>S.cfg.collectOn&&S.cfg.canCollect;
const A={
  focusSearch(){ S.drop=true; render(); setTimeout(()=>$('#csearch')?.focus(),0); },
  type(v){ S.q=v; S.drop=true; renderDrop(); },
  pick(id){ const c=S.custs.find(x=>x.id===id); S.cust=c; S.q=''; S.drop=false;
    S.dlg = warnable(c)?{k:'warn'}:null; toast(`Đã chọn ${c.name}`, c.walkin?'Khách lẻ không theo dõi công nợ':(total(c)>0&&!warnable(c)?whyNoWarn(c):'')); },
  clearCust(){ S.cust=null; S.dlg=null; A.focusSearch(); },
  change(){ S.dlg=null; A.clearCust(); },
  cont(){ S.dlg=null; S.collected=null; render(); },
  reopen(){ if(warnable(S.cust)) { S.dlg={k:'warn'}; render(); } else A.collect(); },
  add(i){ const it=ITEMS[i]; const l=S.cart.find(x=>x.c===it[0]); l?l.q++:S.cart.push({c:it[0],n:it[1],p:it[2],q:1}); render(); },
  qty(i,dq){ S.cart[i].q+=dq; if(S.cart[i].q<=0) S.cart.splice(i,1); render(); },
  rm(i){ S.cart.splice(i,1); render(); },
  collect(){ if(!S.cust||S.cfg.offline||!canColl()) return; const ds=debts(S.cust);
    S.dlg={k:'collect', sel:ds.map(i=>i.n), amt:total(S.cust), mop:'Cash', back:S.dlg?.k==='warn'?'warn':'none'}; render(); },
  collSel(n,on){ const g=S.dlg; on?g.sel.push(n):g.sel=g.sel.filter(x=>x!==n);
    g.amt=Math.min(g.amt, selTotal()); if(g.amt===0) g.amt=selTotal(); render(); },
  collAmt(v){ S.dlg.amt=Math.max(0,Number(String(v).replace(/[^\d]/g,''))||0); renderDialogOnly(); },
  collDo(){ const g=S.dlg; const c=S.cust; const st=selTotal(); if(g.amt<=0||g.amt>st) return;
    let left=g.amt; const paid=[];
    debts(c).filter(i=>g.sel.includes(i.n)).forEach(i=>{ if(left<=0) return; const take=Math.min(left,i.o); const inv=c.inv.find(x=>x.n===i.n); inv.o-=take; left-=take; paid.push(i.n); });
    S.collected={amt:g.amt, paid};
    const rest=total(c);
    if(g.back!=='warn'||!warnable(c)){ S.dlg=null; S.collected=null; toast(rest<=0?`Đã thu hết nợ ${vnd(g.amt)}`:`Đã thu nợ ${vnd(g.amt)}`, `Khách ${c.name} · còn nợ ${vnd(rest)}`); return; }
    if(rest<=0){ S.dlg=null; S.collected=null; toast(`Đã thu hết nợ ${vnd(g.amt)}`, `Khách ${c.name} không còn nợ tại quầy · cảnh báo đã đóng`); return; }
    S.dlg={k:'warn'}; toast(`Đã thu nợ ${vnd(g.amt)}`, `Khách ${c.name} · còn nợ ${vnd(rest)}`); },
  checkout(){ if(!S.cart.length) return; S.payPaid=0; S.payMop='Cash'; S.dlg={k:'pay'}; render(); },
  payAmt(v){ S.payPaid=Math.max(0,Number(String(v).replace(/[^\d]/g,''))||0); renderDialogOnly(); },
  payQuick(v){ S.payPaid=v; render(); },
  payFull(){ const tot=Math.round(cartTotal()); if(S.payPaid<tot) return; finishSale(0,null); },
  payOnAccount(){ const c=S.cust; const tot=Math.round(cartTotal()); const credit=Math.max(0,tot-Math.min(S.payPaid,tot));
    if(!S.cfg.allowCredit) return;
    if(!c||c.walkin){ S.dlg={k:'msg',t:'Cần chọn khách có tên',s:'Bán chịu (Pay on Account) phải gắn với một khách. Khách lẻ không theo dõi công nợ — chọn hoặc tạo khách trước.'}; render(); return; }
    finishSale(credit,null); },
  backToPay(){ S.dlg={k:'pay'}; render(); },
  close(){ S.dlg=null; render(); },
  drawer(on){ S.drawer=on; render(); },
  set(k,v){ S.cfg[k]=v; render(); },
  toggleEx(g){ const e=S.cfg.excluded; e.includes(g)?S.cfg.excluded=e.filter(x=>x!==g):e.push(g); render(); },
  resetAll(){ reset(); render(); toast('Đã đặt lại dữ liệu mockup','Công nợ và cấu hình về như ban đầu'); },
};
function selTotal(){ const g=S.dlg; return debts(S.cust).filter(i=>g.sel.includes(i.n)).reduce((s,i)=>s+i.o,0); }
function whyNoWarn(c){ if(!S.cfg.enabled) return 'Quầy đang tắt cảnh báo công nợ'; if(excluded(c)) return `Nhóm "${c.group}" không cảnh báo — vẫn còn nợ ${vnd(total(c))}`; if(total(c)<S.cfg.threshold) return `Nợ ${vnd(total(c))} dưới ngưỡng ${vnd(S.cfg.threshold)} nên không cảnh báo`; return ''; }
function finishSale(credit, approvedBy, note){ const c=S.cust; const tot=Math.round(cartTotal()); const name='ACC-SINV-2026-00'+(S.seq++);
  if(credit>0 && c){ c.inv.push({n:name,d:TODAY,o:credit,g:credit}); }
  S.cart=[]; S.dlg={k:'done', name, tot, credit, approvedBy, note, cname:c?c.name:'Khách lẻ'}; render(); }

function custCard(c){

function renderDialogOnly(){ const ov=$('#ov'); if(!ov) return; const a=document.activeElement; const id=a&&a.id; const pos=a&&a.selectionStart; ov.innerHTML=dialog(); if(id){const e=document.getElementById(id); if(e){e.focus(); try{e.setSelectionRange(pos,pos);}catch(_){}}} }

function debtTable(c,withPaid){ const rows=debts(c);

  <div class="dh"><span class="ic w">!</span><h3>Khách hàng đang còn nợ</h3><button class="cl" onclick="A.cont()" aria-label="Đóng">✕</button></div>

      <button class="bt p" style="flex:1;padding:11px" onclick="A.payFull()" ${paid>=tot?'':'disabled'}>✓ Complete Payment</button></div>
    <div class="hint">${S.cfg.allowCredit?`Pay on Account = ghi nợ phần còn lại (${vnd(tot-paid)}). Quầy cho bán chịu nên không bị chặn, kể cả khách đang quá hạn.`:'Quầy này không cho bán chịu: không có nút Pay on Account, phải thanh toán đủ. Server cũng từ chối hoá đơn còn nợ.'}</div>

  </div></div></div></div>`; }
function doneDlg(){ const g=S.dlg;
  return `<div class="dl sm"><div class="dh"><span class="ic ok">✓</span><h3>Đã tạo hoá đơn ${g.name}</h3></div>

function drawer(){ const f=S.cfg; const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${f[k]===v?'on':''}" onclick="A.set('${k}','${v}')">${l}</button>`).join('')}</div>`;
  const groups=['Khách buôn','Khách quen','Individual'];
  return `<div class="ov" onclick="A.drawer(false)" style="background:rgba(17,24,39,.25)"></div><aside class="drawer" aria-label="Cấu hình quầy">
  <div class="dh"><h3>Cấu hình quầy · POS Chiềng Sại</h3><button class="cl" onclick="A.drawer(false)" aria-label="Đóng">✕</button></div>
  <div class="dbody">
    <div class="hint" style="margin-top:8px">Trên hệ thống thật, quản trị đặt các ô này trong POS Profile. Đổi ở đây có hiệu lực ngay cho lần chọn khách tiếp theo.</div>
    <div class="grp"><h4>Cảnh báo công nợ</h4>
      <label class="chk"><input type="checkbox" ${f.enabled?'checked':''} onchange="A.set('enabled',this.checked)"> Bật cảnh báo công nợ</label>
      <label class="lb" for="thr">Ngưỡng tổng nợ tối thiểu (₫)</label><input id="thr" class="in num" inputmode="numeric" value="${f.threshold.toLocaleString('vi-VN')}" onchange="A.set('threshold',Number(this.value.replace(/\\D/g,''))||0)">
      <div class="hint">Thử 50.000: THU HUONG (nợ 7.864 ₫) sẽ không còn cảnh báo.</div>
      <span class="lb">Nhóm khách không cảnh báo</span>${groups.map(g=>`<label class="chk"><input type="checkbox" ${f.excluded.includes(g)?'checked':''} onchange="A.toggleEx('${g}')"> ${g}</label>`).join('')}
      <div class="hint">Chị Huế thuộc "Khách buôn", A Linh thuộc "Khách quen".</div></div>
    <div class="grp"><h4>Bán chịu</h4><label class="chk"><input type="checkbox" ${f.allowCredit?'checked':''} onchange="A.set('allowCredit',this.checked)"> Cho phép bán chịu (bán có nợ)</label>
      <div class="hint">Không tick: mọi đơn phải thanh toán đủ, không có Pay on Account. Có tick: được bán chịu, cảnh báo chỉ để thông tin. Đã chốt 02/10: dùng ô có sẵn "Allow Credit Sale" trong POS Settings của quầy; server chặn hoá đơn còn nợ — chức năng Thu nợ làm.</div></div>
    <div class="grp"><h4>Thu nợ (chức năng 1)</h4><label class="chk"><input type="checkbox" ${f.collectOn?'checked':''} onchange="A.set('collectOn',this.checked)"> Quầy bật thu nợ trên POS</label>
      <label class="chk"><input type="checkbox" ${f.canCollect?'checked':''} onchange="A.set('canCollect',this.checked)"> Thu ngân đang đăng nhập có quyền thu nợ</label>
      <label class="lb" for="hb">Ẩn nợ lẻ dưới (₫)</label><input id="hb" class="in num" inputmode="numeric" value="${f.hideBelow.toLocaleString('vi-VN')}" onchange="A.set('hideBelow',Number(this.value.replace(/\D/g,''))||0)">
      <div class="hint">Đơn còn nợ dưới mức này không hiện ở Thu nợ, huy hiệu lẫn cảnh báo (để 0 = không ẩn). Thử với THU HUONG: có 3 đơn nợ lẻ 15–25 ₫ do làm tròn.</div>
      <div class="hint">Thử: tắt cảnh báo nhưng bật thu nợ → bấm huy hiệu sẽ mở thẳng hộp thoại Thu nợ.</div></div>
    <div class="grp"><h4>Mạng</h4><label class="chk"><input type="checkbox" ${f.offline?'checked':''} onchange="A.set('offline',this.checked)"> Giả lập mất mạng</label></div>
    <div class="grp"><h4>Hạn thanh toán (đã chốt A2)</h4>
      <label class="lb" for="dd">Số ngày được nợ của quầy</label><input id="dd" class="in num" inputmode="numeric" value="${f.defDays}" onchange="A.set('defDays',Number(this.value)||0)">
      <div class="hint">Hạn = ngày bán + số ngày này, áp cả đơn cũ. Để 0 = hạn là ngày bán (như dữ liệu hiện nay: mọi đơn chưa trả đều quá hạn từ hôm sau). Thử 180 để thấy A Linh chưa tới hạn (huy hiệu vàng).</div></div>
    <div class="grp"><button class="bt" style="width:100%" onclick="A.resetAll()">↺ Đặt lại dữ liệu và cấu hình</button></div>
  </div></aside>`; }

document.addEventListener('mousedown',e=>{ if(S.drop && !e.target.closest('.cust')){ S.drop=false; renderDrop(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(S.drawer) A.drawer(false); else if(S.dlg&&S.dlg.k==='warn') A.cont(); } });
render();
</script>

</body></html>
