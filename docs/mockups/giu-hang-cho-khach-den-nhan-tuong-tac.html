 add_h:d=>{S.modal.add=+d.h;},
 extendOk:d=>{const h=S.holds.find(x=>x.id===d.id),D=S.modal,max=h.created+S.maxH*H;const nu=D.add===-1?max:h.until+D.add*H;if(nu>max)return;h.until=nu;h.log.push([now(),(S.role==='manager'?'Quản lý CH':'Thu ngân')+' gia hạn đến '+fmtT(nu)+(D.reason.trim()?': '+D.reason.trim():'')]);S.modal={type:'detail',id:h.id};toast('Đã gia hạn '+h.id+' đến '+fmtT(nu));},
 cancel:d=>{const h=S.holds.find(x=>x.id===d.id);if(!live(h)){toast('Đơn đã đổi trạng thái — đã tải lại');S.modal=null;return;}S.modal={type:'cancel',id:d.id,r:'',txt:''};},
 reason:d=>{S.modal.r=d.v;},
 cancelOk:d=>{const h=S.holds.find(x=>x.id===d.id),D=S.modal;const why=D.r==='Khác'?D.txt.trim():D.r+(D.txt.trim()?' — '+D.txt.trim():'');h.status='huy';h.reason=why;h.log.push([now(),'Quản lý CH huỷ giữ: '+why]);S.modal=null;toast('Đã huỷ '+h.id+' — hàng trả về số bán được');},
 deliver:d=>{const h=S.holds.find(x=>x.id===d.id);if(d.part){const l=h.lines.find(l=>heldLine(l)>1)||h.lines.find(l=>heldLine(l)>0);const n=Math.max(1,Math.floor(heldLine(l)/2));l.del+=n;item(l.code).actual-=n;const back=h.lines.reduce((s,x)=>s+heldLine(x),0);h.lines.forEach(x=>x.qty=x.del);h.status='lay';h.log.push([now(),'Giao một phần ở hệ thống lõi: '+n+' '+item(l.code).uom+' '+item(l.code).name+' — đơn kết thúc, '+back+' đơn vị chưa lấy trả về kệ']);toast(h.id+' giao thiếu → Đã lấy, '+back+' đơn vị trả về kệ ngay');}
  else{h.lines.forEach(l=>{const n=heldLine(l);l.del+=n;item(l.code).actual-=n;});h.status='lay';h.log.push([now(),'Giao đủ ở hệ thống lõi (phiếu giao DN-2026-000'+(40+S.seq)+')']);toast(h.id+' đã giao đủ → Đã lấy');}},
 pickup:d=>{const h=S.holds.find(x=>x.id===d.id);if(!live(h)){toast('Đơn đã đổi trạng thái — đã tải lại');S.modal=null;return;}S.modal={type:'pickup',id:d.id};},
 pickupOk:d=>{const h=S.holds.find(x=>x.id===d.id);if(S.cart.length){toast('Giỏ đang có hàng — Lưu nháp hoặc Clear trước khi lấy đơn giữ');return;}
  S.cart=h.lines.filter(l=>heldLine(l)>0).map(l=>({code:l.code,qty:heldLine(l)}));h.lines.forEach(l=>l.del=l.qty);h.status='lay';h.log.push([now(),'Khách đến lấy tại POS — nhả giữ, đưa hàng vào giỏ để thanh toán']);
  let c=S.custs.find(x=>x.phone===h.phone);if(!c){c={name:h.cust,phone:h.phone};S.custs.push(c);}S.cust=c;S.modal=null;S.panel=false;toast(h.id+' → Đã lấy. Hàng đã vào giỏ, bấm Checkout để thu tiền');},
 checkout:()=>{S.menu=false;for(const l of S.cart){const sel=sellable(l.code);if(l.qty>sel){S.modal={type:'conflict',code:l.code,qty:l.qty};return;}}finalizeSale();},
 setQty:d=>{const l=S.cart.find(x=>x.code===d.code);l.qty=+d.q;S.modal=null;},
 sellAnyway:()=>finalizeSale(),
 set:d=>{const v=d.v==='true'?true:d.v==='false'?false:d.v;S[d.k]=v;S.menu=false;if(d.k==='role'&&v==='none'&&S.modal&&['extend','cancel','hold'].includes(S.modal.type))S.modal=null;},
 tt:d=>{S.offset+=d.h*H;sweep();toast('Đã tua thêm '+d.h+' giờ');},
 otherHold:()=>{const c='146048',n=Math.min(20,sellable(c)-inCart(c));if(n<=0){toast('Chả Tôm đã hết số bán được');return;}const t=now();S.holds.push({id:'SAL-ORD-2026-'+String(S.seq++).padStart(5,'0'),cust:'Anh Bình',phone:'0915226019',lines:[{code:c,qty:n,del:0}],created:t,until:t+8*H,status:'giu',note:'Quầy khác tạo',by:'Thu ngân Lan',log:[[t,'Thu ngân Lan (máy quầy 2) tạo đơn giữ, giữ 8 giờ']]});toast('Quầy 2 vừa giữ '+n+' gói Chả Tôm — số trên lưới cập nhật ngay');},
 reset:()=>{seed();toast('Đã đặt lại dữ liệu ví dụ');}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');
 if(!el){if(S.custOpen&&!e.target.closest('.cust')){S.custOpen=false;renderCart();}if(S.menu&&!e.target.closest('.acts')){S.menu=false;renderCart();}return;}
 if(el.disabled)return;if(el.dataset.act==='ovClose'&&!e.target.classList.contains('ov'))return;const f=A[el.dataset.act];if(!f)return;f(el.dataset,e);render();});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='iq'){S.iq=t.value;renderGrid();}
 else if(t.id==='cq'){S.custQ=t.value;S.custOpen=true;const p=t.selectionStart;renderCart();const n=$('#cq');n.focus();n.setSelectionRange(p,p);}
 else if(t.id==='hnote'){S.modal.note=t.value;}
 else if(t.id==='hprint'){S.modal.print=t.checked;}
 else if(t.id==='xr'){S.modal.reason=t.value;}
 else if(t.id==='cr'){S.modal.txt=t.value;const b=document.querySelector('[data-act="cancelOk"]');if(b)b.disabled=!S.modal.r||(S.modal.r==='Khác'&&!t.value.trim());}
 else if(t.id==='pq'){S.pq=t.value;const p=t.selectionStart;renderPanel();const n=$('#pq');n.focus();n.setSelectionRange(p,p);}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.qty){const v=Math.max(0,parseInt(t.value)||0);const l=S.cart.find(x=>x.code===t.dataset.qty);if(v===0)S.cart=S.cart.filter(x=>x!==l);else l.qty=v;render();}
 if(t.id==='defH'||t.id==='maxH'){S.defH=Math.max(1,parseInt($('#defH').value)||24);S.maxH=Math.max(S.defH,parseInt($('#maxH').value)||72);render();}
});
document.addEventListener('focusin',e=>{if(e.target.id==='cq'&&!S.custOpen){S.custOpen=true;renderCart();const n=$('#cq');n.focus();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal)S.modal=null;else if(S.panel)S.panel=false;else{S.custOpen=false;S.menu=false;}render();}});
function tick(){const d=new Date(now());const s=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());$('#clock').textContent=s;
 $('#ctlclk').textContent=(S.offset?'⏩ ':'')+pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+s.slice(0,5);
 document.querySelectorAll('[data-until]').forEach(el=>el.textContent=left(+el.dataset.until));
 if(sweep())render();}
seed();
// bắt đầu ở trạng thái đang làm việc: đã chọn C HUỆ, giỏ có 3 món như ví dụ trong spec
S.cust=S.custs[0];S.cart=[{code:'146047',qty:2},{code:'146048',qty:1},{code:'335047',qty:1}];
render();tick();setInterval(tick,1000);
if(window.matchMedia('(max-width:900px)').matches)$('#ctl').open=false;
})();
</script>
