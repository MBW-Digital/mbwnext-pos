<!doctype html>
<!--
  Mockup: Đổi trả hàng trên POS — PM-FEAT-00060 (PM-PRJ-00025)
  Spec: docs/features/doi-hang.md, mục 0 (đã chốt) và mục 6 (spec đợt 1)
  Lối vào: nút "Đổi / Trả hàng" trên màn hình bán (POSSale.vue, InvoiceCart.vue)
           và nút "Đổi / Trả" trên từng dòng Lịch sử hóa đơn (InvoiceHistoryDialog.vue)

  Lịch sử chốt:
  - 2026-09-29  Bản 1, gửi anh Thắng duyệt (vòng 1 nội bộ). Dữ liệu trong mockup là ví dụ.
  - 2026-10-01  Anh Thắng duyệt bản 1.
  - 2026-10-06  Bản 2: bước 4 "Chọn hàng mới" chuyển ra MÀN HÌNH BÁN (chế độ đổi hàng) thay vì lưới
                chọn hàng trong hộp thoại — để giá hàng mới dùng đúng logic bán hàng có sẵn (Pricing
                Rule theo giờ/kho, KM dòng, quét mã vạch, lô, tồn kho). Anh Quân chọn 06/10, chờ anh
                Thắng duyệt lại riêng bước này. Các bước khác giữ nguyên bản 1.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Đổi trả hàng trên POS</title>
<style>
:root{
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;--g400:#9CA3AF;--g500:#6B7280;--g600:#4B5563;--g700:#374151;--g900:#111827;
  --b50:#EFF6FF;--b100:#DBEAFE;--b500:#3B82F6;--b600:#2563EB;--b700:#1D4ED8;
  --gr50:#F0FDF4;--gr100:#DCFCE7;--gr600:#16A34A;--gr700:#15803D;
  --a50:#FFFBEB;--a100:#FEF3C7;--a200:#FDE68A;--a700:#B45309;--a900:#78350F;
  --r50:#FEF2F2;--r200:#FECACA;--r600:#DC2626;--r700:#B91C1C;
  --v50:#F5F3FF;--v200:#DDD6FE;--v700:#6D28D9;
}
*{box-sizing:border-box}
body{margin:0;background:#E9EBEF;color:var(--g900);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
/* thanh điều khiển mockup */
.ctl{background:#1F2937;color:#E5E7EB;padding:12px 16px;display:grid;gap:10px}
.ctl .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl .lbl{font-size:12px;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.ctl .sc{background:#374151;color:#E5E7EB;border:1px solid #4B5563;border-radius:999px;padding:5px 12px;font-size:13px}
.ctl .sc[aria-pressed="true"]{background:#FFFFFF;color:#111827;border-color:#FFFFFF;font-weight:600}
.ctl select{background:#374151;color:#E5E7EB;border:1px solid #4B5563;border-radius:6px;padding:5px 8px;font:inherit;font-size:13px}
.ctl label{font-size:13px;display:inline-flex;gap:6px;align-items:center}
.ctl .desc{font-size:13px;color:#D1D5DB}
/* khung POS */
.stage{padding:24px 16px 48px}
.dlg{max-width:1100px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.12);overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--g200)}
.dh h2{font-size:18px;margin:0;font-weight:600}
.x{border:0;background:none;color:var(--g400);font-size:20px;line-height:1}
.steps{display:flex;gap:0;padding:12px 20px;border-bottom:1px solid var(--g100);background:var(--g50);overflow-x:auto}
.st{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--g400);white-space:nowrap;padding-right:18px}
.st .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--g200);color:var(--g500)}
.st.on{color:var(--g900);font-weight:600}.st.on .dot{background:var(--b600);color:#fff}
.st.done{color:var(--g600)}.st.done .dot{background:var(--gr600);color:#fff}
.st.skip{opacity:.4;text-decoration:line-through}
.db{padding:20px;min-height:420px}
.df{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--g200);background:var(--g50)}
.btn{border:1px solid var(--g300);background:#fff;color:var(--g700);border-radius:8px;padding:8px 16px;font-weight:500}
.btn.pri{background:var(--b600);border-color:var(--b600);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lab{display:block;font-size:13px;font-weight:500;color:var(--g700);margin-bottom:8px}
.inp{width:100%;border:1px solid var(--g300);border-radius:8px;padding:8px 12px;font:inherit}
.card{border:1px solid var(--g200);border-radius:10px;background:#fff}
.inv{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--g100)}
.inv:last-child{border-bottom:0}
.inv.sel{background:var(--b50);outline:2px solid var(--b500);outline-offset:-2px;border-radius:8px}
.inv.dis{background:var(--g50);color:var(--g400)}
.av{width:36px;height:36px;border-radius:50%;background:var(--b100);color:var(--b700);display:grid;place-items:center;font-weight:600;flex:none}
.inv.dis .av{background:var(--g200);color:var(--g500)}
.grow{flex:1;min-width:0}
.t{font-weight:600}.s{font-size:12px;color:var(--g500)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;vertical-align:1px}
.tag.ok{background:var(--gr100);color:var(--gr700)}.tag.warn{background:var(--a100);color:var(--a700)}.tag.bad{background:var(--r50);color:var(--r700)}.tag.info{background:var(--b100);color:var(--b700)}.tag.gray{background:var(--g100);color:var(--g600)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--g500);text-align:left;padding:8px 10px;border-bottom:1px solid var(--g200);background:var(--g50)}
td{padding:10px;border-bottom:1px solid var(--g100);vertical-align:top}
td.r,th.r{text-align:right}
tr.off td{color:var(--g400)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--g300);border-radius:6px;overflow:hidden}
.qty span{padding:3px 10px;min-width:42px;text-align:center}
.qty b{padding:3px 8px;background:var(--g50);color:var(--g500);font-weight:500}
.chk{width:16px;height:16px;accent-color:var(--b600)}
.note{border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.amber{background:var(--a50);border:1px solid var(--a200);color:var(--a900)}
.note.red{background:var(--r50);border:1px solid var(--r200);color:var(--r700)}
.note.blue{background:var(--b50);border:1px solid var(--b100);color:var(--b700)}
.note.green{background:var(--gr50);border:1px solid var(--gr100);color:var(--gr700)}
.ic{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.amber .ic{background:#D97706}.red .ic{background:var(--r600)}.blue .ic{background:var(--b600)}.green .ic{background:var(--gr600)}
.tech{display:none;margin-top:6px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--v700);background:var(--v50);border:1px dashed var(--v200);border-radius:6px;padding:6px 8px}
body.showtech .tech{display:block}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.opt{border:2px solid var(--g200);border-radius:12px;padding:18px;background:#fff;text-align:left}
.opt.sel{border-color:var(--b600);background:var(--b50)}
.opt h4{margin:0 0 4px;font-size:16px}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.it{border:1px solid var(--g200);border-radius:10px;padding:10px;background:#fff;text-align:left}
.it .ph{height:64px;border-radius:6px;background:linear-gradient(135deg,var(--g100),var(--g200));margin-bottom:8px;display:grid;place-items:center;color:var(--g400);font-size:12px}
.it.sel{border-color:var(--b600);box-shadow:0 0 0 1px var(--b600)}
.it.oos{opacity:.55}
.sum{background:var(--g50);border:1px solid var(--g200);border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start}
.sum h4{margin:0;font-size:14px}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.ln.sub{color:var(--g500);padding-left:10px}
.ln.tot{font-size:15px;font-weight:700;border-top:1px solid var(--g300);padding-top:8px}
.big{font-size:22px;font-weight:700}
.pos{color:var(--b700)}.neg{color:var(--gr700)}
.pay{display:grid;gap:8px}
.pm{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--g200);border-radius:8px;padding:10px 12px}
.pm.sel{border-color:var(--b600);background:var(--b50)}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.gal .card{padding:14px;display:grid;gap:8px}
.gal h5{margin:0;font-size:13px;color:var(--g500);text-transform:uppercase;letter-spacing:.04em}
.rc{max-width:420px;margin:0 auto;border:1px dashed var(--g300);border-radius:10px;padding:16px;font-size:13px;display:grid;gap:6px}
@media (max-width:760px){.split{grid-template-columns:1fr}.db{padding:14px}}
</style>
</head>
<body>

<div class="ctl">
  <div class="row"><span class="lbl">Thanh điều khiển mockup — không có trên hệ thống thật</span></div>
  <div class="row" id="scs"></div>
  <div class="row">
    <label>Cấu hình cửa hàng khi chênh âm (B3):
      <select id="cfg">
        <option value="refund">Hoàn tiền</option>
        <option value="credit">Ghi có vào số dư khách</option>
        <option value="topup">Bắt khách lấy thêm hàng</option>
      </select></label>
    <label><input type="checkbox" id="tech"> Hiện ghi chú kỹ thuật</label>
  </div>
  <div class="desc" id="scdesc"></div>
</div>

<div class="stage">
  <div class="dlg">
    <div class="dh"><h2>Đổi / Trả hàng</h2><button class="x" aria-label="Đóng">×</button></div>
    <div class="steps" id="steps"></div>
    <div class="db" id="body"></div>
    <div class="df"><button class="btn" id="back">‹ Quay lại</button><button class="btn pri" id="next">Tiếp ›</button></div>
  </div>
</div>

<script>
const f = n => (n<0?"−":"") + Math.abs(Math.round(n)).toLocaleString("vi-VN") + "đ";
const fs = n => (n>0?"+":"") + f(n);

// ---------------- dữ liệu mẫu ----------------
const INV = {no:"ACC-SINV-2026-01234", cus:"Nguyễn Thị Lan", phone:"0912 345 678", date:"25/09/2026", total:999000, subtotal:1049000, promo:50000, promoName:"Đơn từ 1.000.000đ giảm 50.000đ", threshold:1000000};
const LINES = [
  {id:1, name:"Áo thun cổ tròn — Trắng / M", qty:2, uom:"Cái", rate:250000, share:11916},
  {id:2, name:"Quần jean slim — Xanh / 30", qty:1, uom:"Cái", rate:450000, share:21449},
  {id:3, name:"Móc khóa da (quà tặng kèm quần jean)", qty:1, uom:"Cái", rate:0, share:0, free:2},
  {id:4, name:"Tất cổ ngắn — Combo 3 đôi", qty:1, uom:"Combo", rate:99000, share:4719, combo:{n:3, unit:39000}},
];
const NEW = [
  {id:"a", name:"Áo thun cổ tròn — Trắng / L", price:250000, stock:12},
  {id:"b", name:"Quần jean slim — Đen / 31", price:450000, stock:4},
  {id:"c", name:"Mũ lưỡi trai — Be", price:150000, stock:20},
  {id:"d", name:"Áo khoác gió — Xám / M", price:590000, stock:0},
];
const REASONS = [["size","Không vừa size","Kho bán"],["loi","Lỗi sản phẩm","Kho hàng lỗi"],["doiy","Khách đổi ý","Kho bán"],["nham","Giao nhầm hàng","Kho bán"]];

const SC = [
 {id:"s1", name:"Đổi size cùng giá", desc:"Khách đổi 1 áo size M lấy size L, cùng giá 250.000đ. Giỏ gộp vẫn đủ ngưỡng KM → chênh 0đ.", mode:"exchange", pick:"a", reason:"size"},
 {id:"s2", name:"Đổi sang hàng đắt hơn", desc:"Khách đổi 1 áo (250.000đ) lấy quần jean đen (450.000đ) → khách trả thêm 200.000đ.", mode:"exchange", pick:"b", reason:"size"},
 {id:"s3", name:"Đổi sang hàng rẻ hơn", desc:"Khách đổi 1 áo lấy mũ 150.000đ. Giỏ gộp còn 949.000đ, dưới ngưỡng nên mất KM 50.000đ → chênh −50.000đ, xử lý theo cấu hình cửa hàng (đổi ở thanh trên).", mode:"exchange", pick:"c", reason:"doiy"},
 {id:"s4", name:"Chỉ trả hàng", desc:"Khách trả 1 áo, không lấy gì. Mất KM ngưỡng đơn, và khách đã tiêu gần hết điểm → trừ tiền quy đổi điểm vào tiền hoàn.", mode:"return", reason:"loi"},
 {id:"s5", name:"HĐ còn nợ", desc:"HĐ gốc khách mới trả 400.000đ, còn nợ 599.000đ. Khách trả 1 áo → giảm nợ trước, không chi tiền.", mode:"return", reason:"doiy", debt:599000},
 {id:"s6", name:"Các trường hợp bị chặn", desc:"Tổng hợp các thông báo chặn và dòng bị khóa, theo đúng những gì anh Thắng đã chốt.", mode:"gallery"},
];
let sc = SC[0], step = 0;

// ---------------- tính tiền ----------------
function calc(){
  const ret = LINES[0].rate;                       // 1 áo trả, tính theo giá lúc mua
  const kept = INV.subtotal - ret;                 // 799.000
  const nw = sc.mode==="exchange" ? NEW.find(x=>x.id===sc.pick).price : 0;
  const basket = kept + nw;
  const keepPromo = basket >= INV.threshold;
  const mustPay = basket - (keepPromo ? INV.promo : 0);
  const paid = sc.debt ? INV.total - sc.debt : INV.total;
  let diff = mustPay - INV.total;                 // so với tổng HĐ gốc (đã trả + nợ)
  // điểm (kịch bản 4)
  let pts = null;
  if(sc.id==="s4"){ const earned=99, recalc=Math.floor(mustPay/10000), take=earned-recalc, has=5, short=Math.max(0,take-has); pts={earned,recalc,take,has,short,money:short*1000}; diff += pts.money; }
  // công nợ (kịch bản 5)
  let debt = null;
  if(sc.debt && diff<0){ const cut=Math.min(sc.debt,-diff); debt={before:sc.debt,cut,after:sc.debt-cut}; diff += cut; }
  return {ret, retNet:ret-LINES[0].share, kept, nw, basket, keepPromo, mustPay, paid, diff, pts, debt};
}

// ---------------- các bước ----------------
function stepsFor(){
  if(sc.mode==="gallery") return ["Các trường hợp bị chặn"];
  return ["Chọn hóa đơn","Chọn hàng trả","Đổi hay trả", "Chọn hàng mới (màn hình bán)","Thanh toán","Hoàn tất"];
}
function skipped(i){ return sc.mode==="return" && i===3; }

function renderSteps(){
  const arr = stepsFor();
  document.getElementById("steps").innerHTML = arr.map((t,i)=>{
    const cls = skipped(i)?"skip": i<step?"done": i===step?"on":"";
    return `<div class="st ${cls}"><span class="dot">${i<step&&!skipped(i)?"✓":i+1}</span>${t}</div>`;
  }).join("");
}

function S0(){ // chọn hóa đơn
  return `
  <label class="lab">Chọn hóa đơn cần đổi / trả</label>
  <input class="inp" value="${INV.no}" aria-label="Tìm hóa đơn">
  <div class="s" style="margin:6px 0 12px">Tìm theo số hóa đơn, tên hoặc SĐT khách. Chỉ hiện hóa đơn của cửa hàng này.</div>
  <div class="card">
    <div class="inv sel"><div class="av">NL</div><div class="grow"><div class="t">${INV.no} <span class="tag ok">Đổi trả được · còn 3 ngày</span>${sc.debt?' <span class="tag warn">Còn nợ '+f(sc.debt)+'</span>':''}</div>
      <div class="s">${INV.cus} · ${INV.phone} · ${INV.date}</div></div><div class="r num t">${f(INV.total)}</div></div>
    <div class="inv dis"><div class="av">TH</div><div class="grow"><div class="t">ACC-SINV-2026-01198 <span class="tag gray">Đã đổi trả 1 lần</span></div>
      <div class="s">Trần Văn Hùng · 26/09/2026 · phiếu ACC-SINV-RET-2026-00087</div></div><div class="num">1.250.000đ</div></div>
    <div class="inv dis"><div class="av">LA</div><div class="grow"><div class="t">ACC-SINV-2026-01102 <span class="tag bad">Quá hạn đổi trả (7 ngày)</span></div>
      <div class="s">Lê Minh Anh · 18/09/2026</div></div><div class="num">480.000đ</div></div>
  </div>
  <div class="tech">Danh sách: get_returnable_invoices — thêm điều kiện loại HĐ đã có Sales Invoice docstatus=1 với return_against = HĐ này. Dòng xám vẫn hiện để thu ngân biết vì sao không chọn được. Hạn: POS Settings.return_validity_days (chặn cứng, không duyệt vượt).</div>`;
}

function S1(){ // chọn hàng trả
  return `
  <div class="note blue" style="margin-bottom:12px"><span class="ic">i</span><div>HĐ <b>${INV.no}</b> · ${INV.cus} · KM: ${INV.promoName}. <b>Mỗi hóa đơn chỉ đổi trả được 1 lần</b>: chọn đủ hàng cần đổi / trả trong lần này.</div></div>
  <div style="overflow-x:auto"><table>
   <tr><th></th><th>Mặt hàng</th><th class="r">Đã mua</th><th class="r">Giá lúc mua</th><th class="r">Khách thực trả / 1</th><th>SL trả</th></tr>
   ${LINES.map(l=>{
     const on = l.id===1;
     const net = l.rate - (l.share/l.qty);
     if(l.free) return `<tr class="off"><td><input type="checkbox" class="chk" disabled></td><td>${l.name}<div class="s">Quà tặng: chỉ trả kèm khi trả <b>Quần jean slim</b>. Hoàn 0đ.</div></td><td class="r num">${l.qty}</td><td class="r num">0đ</td><td class="r num">0đ</td><td>—</td></tr>`;
     if(l.combo) return `<tr><td><input type="checkbox" class="chk"></td><td>${l.name}<div class="s">Trả lẻ được theo đôi. Giá lẻ lúc mua ${f(l.combo.unit)}/đôi.</div><div class="tech">Trả lẻ: hoàn = giá combo đã trả − Σ giá lẻ lúc mua của món giữ lại (Item Price ngày HĐ gốc). ≤ 0 → hoàn 0đ.</div></td><td class="r num">${l.qty} combo</td><td class="r num">${f(l.rate)}</td><td class="r num">${f(net)}</td><td><span class="qty"><b>−</b><span>0</span><b>+</b></span> <span class="s">đôi</span></td></tr>`;
     return `<tr><td><input type="checkbox" class="chk" ${on?"checked":""}></td><td>${l.name}</td><td class="r num">${l.qty}</td><td class="r num">${f(l.rate)}</td><td class="r num">${f(net)}<div class="s">đã trừ ${f(l.share/l.qty)} KM đơn</div></td><td><span class="qty"><b>−</b><span>${on?1:0}</span><b>+</b></span></td></tr>`;
   }).join("")}
  </table></div>
  <div style="display:grid;grid-template-columns:minmax(0,320px);gap:6px;margin-top:16px">
    <label class="lab" style="margin:0">Lý do trả <span style="color:var(--r600)">*</span></label>
    <select class="inp">${REASONS.map(r=>`<option ${r[0]===sc.reason?"selected":""}>${r[1]} — nhập ${r[2]}</option>`).join("")}</select>
  </div>
  <div class="tech">Lý do: Link POS Return Reason → Sales Invoice.posa_return_reason. stock_destination = Defective → warehouse của dòng trả = POS Profile.posa_defective_warehouse. Số lượng: số nguyên, trừ đơn vị tính không bật must_be_whole_number (hàng cân).</div>`;
}

function S2(){ // đổi hay trả
  const ex = sc.mode==="exchange";
  return `
  <div class="choice">
    <button class="opt ${!ex?"sel":""}"><h4>Trả hàng, hoàn tiền</h4><div class="s">Khách không lấy hàng khác. Hệ thống tính số tiền hoàn, gồm cả thu hồi KM và điểm nếu có.</div></button>
    <button class="opt ${ex?"sel":""}"><h4>Đổi sang hàng khác</h4><div class="s">Khách lấy hàng mới ngay tại quầy. Chỉ thanh toán phần chênh lệch.</div></button>
  </div>
  <div class="note blue" style="margin-top:16px"><span class="ic">i</span><div>Đang trả: <b>1 × Áo thun cổ tròn — Trắng / M</b> · lý do: ${REASONS.find(r=>r[0]===sc.reason)[1]}</div></div>`;
}

function summary(c){
  const promoLine = c.keepPromo
    ? `<div class="ln sub"><span>KM đơn gốc: vẫn đủ ngưỡng, giữ nguyên</span><span class="num">−${f(INV.promo)}</span></div>`
    : `<div class="ln sub" style="color:var(--a700)"><span>KM đơn gốc: dưới ${f(INV.threshold)}, <b>mất KM</b></span><span class="num">0đ</span></div>`;
  return `
  <div class="sum">
    <h4>Tính lại đơn</h4>
    <div class="ln"><span>Hàng khách giữ lại (giá lúc mua)</span><span class="num">${f(c.kept)}</span></div>
    ${sc.mode==="exchange"?`<div class="ln"><span>Hàng mới (giá hiện hành)</span><span class="num">${f(c.nw)}</span></div>`:""}
    <div class="ln"><span>Cộng</span><span class="num">${f(c.basket)}</span></div>
    ${promoLine}
    <div class="ln"><span>Khách phải trả cho đơn mới</span><span class="num t">${f(c.mustPay)}</span></div>
    <div class="ln"><span>Tổng HĐ gốc</span><span class="num">−${f(INV.total)}</span></div>
    ${c.pts?`<div class="ln sub" style="color:var(--a700)"><span>Thu hồi điểm đã tiêu (${c.pts.short} điểm × 1.000đ)</span><span class="num">+${f(c.pts.money)}</span></div>`:""}
    ${c.debt?`<div class="ln sub"><span>Trừ vào công nợ HĐ gốc</span><span class="num">+${f(c.debt.cut)}</span></div>`:""}
    <div class="ln tot"><span>${c.diff>0?"Khách trả thêm":c.diff<0?"Trả lại khách":"Chênh lệch"}</span><span class="num ${c.diff>0?"pos":c.diff<0?"neg":""}">${f(Math.abs(c.diff))}</span></div>
    <div class="tech">Chênh = [Σ hàng giữ lại + Σ hàng mới − KM đơn gốc nếu giỏ gộp ≥ ngưỡng] − tổng HĐ gốc. Chia vào 2 chứng từ: phiếu trả hoàn theo giá thực trả (${f(c.retNet)}); HĐ mới nhận phần KM chuyển sang qua discount_amount để tổng khớp.</div>
  </div>`;
}

function S3(){ // chọn hàng mới — bản 2: trên màn hình bán, chế độ đổi hàng
  const c = calc(), pk = NEW.find(x=>x.id===sc.pick);
  return `
  <div class="note blue" style="margin-bottom:12px"><span class="ic">i</span><div><b>Bản 2:</b> bước này diễn ra trên <b>màn hình bán hàng</b>. Hộp thoại đóng lại, thu ngân quét / chọn hàng mới như bán bình thường (giá, khuyến mại dòng, lô, tồn kho dùng đúng logic bán hàng). Bấm <b>Thanh toán</b> thì sang bước 5.</div></div>
  <div style="border:1px solid var(--g300);border-radius:10px;overflow:hidden">
    <div style="background:var(--a50);border-bottom:1px solid var(--a200);padding:8px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--a900);font-size:13px">
      <span>🔁 <b>Đang đổi hàng</b> cho HĐ ${INV.no} · ${INV.cus} · trả 1 × Áo thun Trắng / M</span>
      <span><b>Khách đã trả cho món này: ${f(c.retNet)}</b> · <a href="#" style="color:var(--a700)">Hủy đổi hàng</a></span>
    </div>
    <div class="split" style="padding:12px;background:var(--g50)">
      <div>
        <input class="inp" placeholder="Tìm hoặc quét mã hàng…" aria-label="Tìm hàng">
        <div class="grid" style="margin-top:12px">
          ${NEW.map(n=>`<button class="it ${n.id===sc.pick?"sel":""} ${n.stock?"":"oos"}" ${n.stock?"":"disabled"}><div class="ph">ảnh</div><div class="t" style="font-size:13px">${n.name}</div><div class="num">${f(n.price)}</div>
            <div class="s">${n.stock?"Tồn: "+n.stock:'<span style="color:var(--r600)">Hết hàng — không đổi được</span>'}</div></button>`).join("")}
        </div>
      </div>
      <div class="card" style="padding:12px;display:grid;gap:8px;align-content:start">
        <div class="t">Giỏ hàng mới</div>
        <div class="ln"><span>1 × ${pk.name}</span><span class="num">${f(c.nw)}</span></div>
        <hr style="border:0;border-top:1px solid var(--g200);width:100%">
        <div class="ln"><span>Hàng mới</span><span class="num">${f(c.nw)}</span></div>
        <div class="ln"><span>Được trừ (hàng trả${c.keepPromo?" + KM đơn gốc chuyển sang":", đơn mất KM"})</span><span class="num">−${f(c.nw - c.diff)}</span></div>
        <div class="ln tot"><span>${c.diff>0?"Khách trả thêm":c.diff<0?"Trả lại khách":"Chênh lệch"}</span><span class="num">${f(Math.abs(c.diff))}</span></div>
        <div class="s">Số này hệ thống tính lại mỗi khi giỏ thay đổi (giỏ gộp: hàng giữ lại + hàng mới).</div>
        <button class="btn pri" style="width:100%">Thanh toán</button>
      </div>
    </div>
  </div>
  <div class="tech">Chế độ đổi hàng: store giữ {invoice_name, return_items, return_reason}. Giỏ dùng posCart như bán thường; formatItemsForSubmission → new_items của pos_next.api.exchange.calculate_exchange / submit_exchange. Màn hình bán bình thường không đổi khi không ở chế độ này.</div>`;
}

function S4(){ // thanh toán
  const c = calc(), cfg = document.getElementById("cfg").value;
  let pay;
  if(c.debt && c.diff===0){
    pay = `<div class="note green"><span class="ic">✓</span><div>Giá trị hàng trả <b>${f(c.debt.cut)}</b> được trừ vào công nợ HĐ gốc. Công nợ còn <b>${f(c.debt.after)}</b> (trước đó ${f(c.debt.before)}). <b>Không chi tiền cho khách.</b></div></div>`;
  } else if(c.diff===0){
    pay = `<div class="note green"><span class="ic">✓</span><div>Không phát sinh thanh toán. Bấm <b>Hoàn tất</b> để tạo phiếu trả và hóa đơn mới.</div></div>`;
  } else if(c.diff>0){
    pay = `<div class="lab">Khách trả thêm <span class="big pos num">${f(c.diff)}</span></div>
      <div class="pay"><div class="pm sel"><span>Tiền mặt</span><span class="num t">${f(c.diff)}</span></div><div class="pm"><span>Chuyển khoản / QR</span><span class="num">0đ</span></div><div class="pm"><span>Thẻ</span><span class="num">0đ</span></div></div>`;
  } else if(cfg==="topup" && sc.mode==="exchange"){
    pay = `<div class="note red"><span class="ic">!</span><div>Cửa hàng không hoàn tiền khi đổi sang hàng rẻ hơn. Khách cần lấy thêm hàng trị giá ít nhất <b>${f(-c.diff)}</b>. <b>Nút Hoàn tất bị khóa</b> cho tới khi chênh lệch ≥ 0đ.</div></div>`;
  } else if(cfg==="credit" && sc.mode==="exchange"){
    pay = `<div class="lab">Ghi có cho khách <span class="big neg num">${f(-c.diff)}</span></div>
      <div class="note blue"><span class="ic">i</span><div>Số tiền được cộng vào <b>số dư của khách ${INV.cus}</b>, dùng cho lần mua sau. Số dư sau khi ghi: ${f(-c.diff)}.</div></div>`;
  } else {
    pay = `<div class="lab">Hoàn cho khách <span class="big neg num">${f(-c.diff)}</span></div>
      <div class="s" style="margin-bottom:8px">HĐ gốc trả bằng: tiền mặt 500.000đ + chuyển khoản 499.000đ. Thu ngân chọn cách hoàn (giữ như hiện tại).</div>
      <div class="pay"><div class="pm sel"><span>Tiền mặt</span><span class="num t">${f(-c.diff)}</span></div><div class="pm"><span>Chuyển khoản</span><span class="num">0đ</span></div><div class="pm"><span>Ghi vào số dư khách</span><span class="num">0đ</span></div></div>
      <div class="s" style="margin-top:8px">Quỹ tiền mặt ca hiện có: 3.420.000đ.</div>`;
  }
  const ptsBox = c.pts ? `<div class="note amber" style="margin-top:12px"><span class="ic">!</span><div>
     <b>Điểm tích lũy:</b> HĐ gốc được cộng ${c.pts.earned} điểm, tính lại theo đơn mới còn ${c.pts.recalc} điểm → thu hồi ${c.pts.take} điểm.
     Khách chỉ còn ${c.pts.has} điểm nên thiếu ${c.pts.short} điểm, quy ra ${f(c.pts.money)} (1 điểm = 1.000đ) và <b>trừ vào tiền hoàn</b>.</div></div>` : "";
  return `<div class="split"><div>${pay}${ptsBox}
    <div class="tech">Chênh dương: payments dương trên HĐ mới. Chênh âm: theo POS Settings.exchange_negative_difference (Refund / Customer Credit / Require Top-up). Refund bằng tiền mặt vượt quỹ ca → chặn (D9).</div></div>${summary(c)}</div>`;
}

function S5(){ // hoàn tất
  const c = calc(), ex = sc.mode==="exchange";
  return `
  <div class="note green" style="margin-bottom:16px"><span class="ic">✓</span><div>Đã ${ex?"đổi":"trả"} hàng xong.</div></div>
  <div class="rc">
    <div class="t" style="text-align:center">PHIẾU ${ex?"ĐỔI":"TRẢ"} HÀNG</div>
    <div class="ln"><span>HĐ gốc</span><span>${INV.no}</span></div>
    <div class="ln"><span>Phiếu trả</span><span>ACC-SINV-RET-2026-00112</span></div>
    ${ex?`<div class="ln"><span>HĐ mới</span><span>ACC-SINV-2026-01302</span></div>`:""}
    <div class="ln"><span>Khách</span><span>${INV.cus}</span></div>
    <hr style="border:0;border-top:1px dashed var(--g300);width:100%">
    <div class="ln"><span>Trả: 1 × Áo thun Trắng / M</span><span></span></div>
    ${ex?`<div class="ln"><span>Lấy: 1 × ${NEW.find(x=>x.id===sc.pick).name}</span><span></span></div>`:""}
    <div class="ln"><span>Lý do</span><span>${REASONS.find(r=>r[0]===sc.reason)[1]}</span></div>
    ${c.debt?`<div class="ln"><span>Giảm công nợ</span><span class="num">${f(c.debt.cut)}</span></div><div class="ln"><span>Công nợ còn</span><span class="num">${f(c.debt.after)}</span></div>`:""}
    <div class="ln tot"><span>${c.diff>0?"Khách trả thêm":c.diff<0?"Hoàn khách":"Chênh lệch"}</span><span class="num">${f(Math.abs(c.diff))}</span></div>
    <div class="s" style="text-align:center;margin-top:6px">Khách ký nhận: ..................</div>
  </div>
  <div style="text-align:center;margin-top:14px"><button class="btn">In phiếu</button> <button class="btn">Hủy phiếu (trong ca)</button></div>
  <div class="tech">1 transaction: phiếu trả (is_return=1, return_against, posa_is_exchange=1, posa_return_reason) + HĐ mới (posa_exchange_against = phiếu trả). Lỗi bước sau → rollback cả hai. Hủy trong ca: cancel cả 2 chứng từ.</div>`;
}

function GAL(){
  const box=(t,cls,msg,sub="")=>`<div class="card"><h5>${t}</h5><div class="note ${cls}"><span class="ic">${cls==="red"?"!":"i"}</span><div>${msg}</div></div>${sub}</div>`;
  return `<div class="gal">
   ${box("Hóa đơn đã đổi trả 1 lần (A3)","red","Hóa đơn ACC-SINV-2026-01198 đã được đổi trả ngày 26/09/2026 (phiếu ACC-SINV-RET-2026-00087). Mỗi hóa đơn chỉ được đổi trả 1 lần.","<div class='s'>Nếu khách muốn đổi tiếp món vừa đổi thì chọn <b>hóa đơn mới</b> của lần đổi trước.</div>")}
   ${box("Quá hạn (A6)","red","Hóa đơn này mua ngày 18/09/2026, đã quá hạn đổi trả 7 ngày. Không thể đổi trả.","<div class='s'>Chặn cứng, không có nút xin duyệt.</div>")}
   ${box("Khác cửa hàng (A5)","red","Hóa đơn này bán tại cửa hàng <b>Quận 3</b>. Chỉ đổi trả được tại đúng cửa hàng đã bán.")}
   ${box("Kỳ kế toán đã khóa sổ (A8)","red","Hóa đơn thuộc kỳ kế toán đã khóa sổ (đến 31/08/2026). Không thể đổi trả.")}
   ${box("Hàng ngừng kinh doanh (F6)","amber","<b>Thắt lưng da nâu</b>: đã ngừng kinh doanh, không nhận trả.","<div class='s'>Dòng hiện xám, không tick được.</div>")}
   ${box("Hàng dịch vụ (F7)","amber","<b>Phí gói quà</b>: hàng dịch vụ, không hoàn tiền.","<div class='s'>Dòng hiện xám, không tick được.</div>")}
   ${box("Quà tặng kèm (C5)","amber","<b>Móc khóa da</b> là quà tặng kèm <b>Quần jean slim</b>. Trả quần jean thì phải trả kèm móc khóa.","<div class='s'>Tick quần jean → móc khóa tự tick và khóa.</div>")}
   ${box("Hàng mới hết tồn (B6)","amber","<b>Áo khoác gió — Xám / M</b> đã hết hàng, không đổi được.")}
   ${box("Bắt lấy thêm hàng (B3, tùy cấu hình)","red","Cửa hàng không hoàn tiền khi đổi sang hàng rẻ hơn. Khách cần lấy thêm hàng trị giá ít nhất 50.000đ.")}
   ${box("Quỹ tiền mặt không đủ (D9)","red","Quỹ tiền mặt ca còn 120.000đ, không đủ hoàn 200.000đ. Chọn hoàn chuyển khoản hoặc ghi vào số dư khách.")}
   ${box("Mất mạng (H7)","amber","Đang mất kết nối. Đổi trả hàng chỉ làm được khi có mạng.")}
   ${box("Cửa hàng tắt đổi trả (H3)","blue","Nút <b>Đổi / Trả hàng</b> không hiện trên màn hình bán khi POS Settings tắt “Cho phép trả hàng”.")}
   <div class="card"><h5>Số lượng: số nguyên / số lẻ (F3, F4)</h5>
     <div class="ln"><span>Nước suối — Thùng 24 chai</span><span class="qty"><b>−</b><span>1</span><b>+</b></span></div>
     <div class="s">Chỉ trả theo thùng, số nguyên. Không tách thùng ra chai.</div>
     <div class="ln" style="margin-top:6px"><span>Hạt điều rang muối (kg)</span><span class="qty"><span>0,35</span></span></div>
     <div class="s">Hàng cân: nhập số lẻ, tối đa bằng số đã mua.</div></div>
   <div class="card"><h5>Trả lẻ combo (C8)</h5>
     <div class="ln"><span>Tất cổ ngắn — Combo 3 đôi, trả 1 đôi</span><span></span></div>
     <div class="ln sub"><span>Giá combo khách đã trả</span><span class="num">94.281đ</span></div>
     <div class="ln sub"><span>Trừ 2 đôi giữ lại × 39.000đ (giá lẻ lúc mua)</span><span class="num">−78.000đ</span></div>
     <div class="ln tot"><span>Hoàn</span><span class="num">16.281đ</span></div>
     <div class="s">Nếu ra số âm thì hoàn 0đ và báo cho thu ngân (<b>đề xuất, chờ anh Thắng xem</b>).</div></div>
  </div>`;
}

const SCREENS=[S0,S1,S2,S3,S4,S5];
function render(){
  document.querySelectorAll(".ctl .sc").forEach(b=>b.setAttribute("aria-pressed", b.dataset.id===sc.id));
  document.getElementById("scdesc").textContent = sc.desc;
  renderSteps();
  const body=document.getElementById("body");
  const back=document.getElementById("back"), next=document.getElementById("next");
  if(sc.mode==="gallery"){ body.innerHTML=GAL(); back.hidden=true; next.hidden=true; return; }
  back.hidden=false; next.hidden=false;
  body.innerHTML = SCREENS[step]();
  back.disabled = step===0;
  const last = step===SCREENS.length-1;
  const c = calc(), cfg=document.getElementById("cfg").value;
  next.textContent = step===4 ? "Hoàn tất" : last ? "Đóng" : "Tiếp ›";
  next.disabled = last || (step===4 && c.diff<0 && cfg==="topup" && sc.mode==="exchange");
}
function go(d){ let s=step+d; if(skipped(s)) s+=d; step=Math.max(0,Math.min(SCREENS.length-1,s)); render(); }

document.getElementById("scs").innerHTML = '<span class="lbl">Kịch bản</span>' + SC.map(s=>`<button class="sc" data-id="${s.id}" aria-pressed="false">${s.name}</button>`).join("");
document.getElementById("scs").addEventListener("click",e=>{const b=e.target.closest(".sc"); if(!b) return; sc=SC.find(s=>s.id===b.dataset.id); step=0; render();});
document.getElementById("back").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);
document.getElementById("cfg").onchange=render;
document.getElementById("tech").onchange=e=>document.body.classList.toggle("showtech",e.target.checked);
render();
</script>
</body>
